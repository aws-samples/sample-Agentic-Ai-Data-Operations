# Translation manifest — the repository is normative, the plugin is derived.
#
# The repo works by being cloned: open Claude Code inside it and .claude/ loads
# automatically. The plugin exists so the same capability works in the user's OWN
# repo, where none of these files are present. So the plugin must CONTAIN the
# content, not reference it — a plugin is copied into
# ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/ at install time and
# cannot see this repository at all.
#
# Copies drift. This manifest is what makes that detectable: every file under
# plugins/claude-code/ must appear here with a source and a category, and
# tests/test_plugin_translation.py enforces it. A plugin file with no entry fails
# the suite, which is the point — it stops content being invented in the plugin
# that should have come from the repo.
#
# Categories, by how faithfully a plugin primitive can carry a repo primitive:
#
#   copy       Byte-identical. Asserted with filecmp. Used for the Python library,
#              schemas, templates and data the agents load at runtime.
#
#   rewrite    Same content, paths retargeted — the plugin's library lives at
#              ${CLAUDE_PLUGIN_ROOT}/lib, not shared/. Asserted structurally:
#              the named anchors must still be present in the derived file.
#
#   transform  A different primitive carries the content (rules -> skills,
#              CLAUDE.md -> command preamble). Asserted by coverage: every source
#              must be claimed by some target, so a new rule cannot be forgotten.
#
#   plugin-only  No repo source. Only legitimate where the plugin must solve a
#              problem the repo solves by other means; each entry states why.
#
#   untranslatable  A repo capability with no plugin equivalent at all. Recorded
#              so it is a documented limitation rather than a silent absence.
#
# Phase A establishes the harness against the files that exist today. Entries are
# added as Phases B-D vendor and translate the rest.

version: 1

# ---------------------------------------------------------------------------
# copy — byte-identical vendored code, asserted with cmp
#
# The layout under lib/ mirrors the repo's relative structure on purpose.
# renderer.py resolves TEMPLATES_DIR as __file__.parent.parent.parent/'shared'/
# 'templates' and spec_loader.py resolves CONTRACTS_DIR the same way, so placing
# codegen at lib/shared/codegen makes both land correctly with no edits. Every
# file below is therefore byte-for-byte its source, and a predecessor plugin's
# approach — rewriting those paths to read ADOP_TEMPLATES_DIR — is what made its
# copies unverifiable.
#
# Proven, not assumed: rendering silver_transform from the same spec and timestamp
# through lib/ and through shared/ produces byte-identical output.
# ---------------------------------------------------------------------------
