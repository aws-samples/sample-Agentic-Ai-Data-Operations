# ADOP mandatory invariants — enforced on every operation regardless of phase or tool.
# severity: BLOCK stops the operation; WARN logs and continues.
invariants:
  - id: lineage-always
    rule: "--enable-data-lineage: true on every Glue ETL job"
    severity: BLOCK
  - id: no-credentials-in-code
    rule: "Credentials via Secrets Manager or Airflow Connections only"
    severity: BLOCK
  - id: bronze-immutable
    rule: "Bronze zone data never modified after ingestion"
    severity: BLOCK
  - id: quality-gates
    rule: "Silver >= 80%, Gold >= 95%; critical failures block promotion"
    severity: BLOCK
  - id: sub-agent-no-mcp
    rule: "Sub-agents generate artifacts only; no MCP, no AWS execution"
    severity: BLOCK
  - id: verify-deployment
    rule: "Confirm tables queryable after deploy (Athena or Redshift)"
    severity: BLOCK
  - id: audit-after-deploy
    rule: "Run audit-log lookup after deploy to confirm logging"
    severity: BLOCK
  - id: zone-scoped-kms
    rule: "Separate CMK for Bronze, Silver, Gold per workload"
    severity: BLOCK
  - id: mcp-first
    rule: "Use MCP tools FIRST; CLI only when unavailable or errored"
    severity: BLOCK
  - id: log-cli-fallback
    rule: "Print warning message on every CLI fallback"
    severity: WARN
