schedule:
  dag_id: supplier_chain_data_pipeline
  description: "Manual ETL: Bronze -> Silver for buyer-supplier relationships."
  cron: null
  timezone: "UTC"
  start_date: "2026-05-01"
  catchup: false
  max_active_runs: 1
  retries: 3
  retry_delay_minutes: 5
  retry_exponential_backoff: true

  dependencies:
    upstream_dags: []
    sensors:
      - type: s3_key
        bucket: "${var:data_lake_bucket}"
        prefix: "raw/supplier_chain_data/"
        poke_interval: 300
        timeout: 3600
        mode: poke

  sla:
    critical_path_tasks:
      - bronze_to_silver
      - quality_gate_silver
      - pii_tagging
    max_duration_minutes: 30

  notifications:
    on_failure:
      - type: sns
        topic_arn: "${var:alert_sns_topic}"

  tags:
    - supplier_chain_data
    - supply-chain
    - manual
    - pii
