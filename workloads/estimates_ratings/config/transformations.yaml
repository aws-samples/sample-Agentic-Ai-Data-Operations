bronze_to_silver:
  deduplication:
    key: ["entity_id", "rating_date"]
    strategy: keep_latest
    order_by: ingestion_ts

  null_handling: []

  type_casting:
    - column: rating_date
      from: string
      to: date
      format: "yyyy-MM-dd"
    - column: buy_count
      from: string
      to: integer
    - column: hold_count
      from: string
      to: integer
    - column: sell_count
      from: string
      to: integer
    - column: target_price_mean
      from: string
      to: double
    - column: target_price_high
      from: string
      to: double
    - column: target_price_low
      from: string
      to: double

  validation:
    - column: entity_id
      rule: "entity_id IS NOT NULL AND entity_id != ''"
      action: quarantine
    - column: rating_date
      rule: "rating_date IS NOT NULL"
      action: quarantine

  derived_columns:
    - name: ingestion_ts
      expression: "current_timestamp()"
      description: "When this record was processed into Silver. Used by latest-wins dedup."

  load_strategy:
    mode: overwrite
    target_format: iceberg
    partitioning: none
