bronze_to_silver:
  deduplication:
    key: ["entity_id", "price_date"]
    strategy: keep_latest
    order_by: ingestion_ts

  null_handling: []

  type_casting:
    - column: price_date
      from: string
      to: date
      format: "yyyy-MM-dd"
    - column: close_price
      from: string
      to: double
    - column: volume
      from: string
      to: long
    - column: market_cap
      from: string
      to: double

  validation:
    - column: entity_id
      rule: "entity_id IS NOT NULL AND entity_id != ''"
      action: quarantine
    - column: price_date
      rule: "price_date IS NOT NULL"
      action: quarantine

  derived_columns:
    - name: ingestion_ts
      expression: "current_timestamp()"
      description: "When this record was processed into Silver."

  load_strategy:
    mode: overwrite
    target_format: iceberg
    partitioning: none
