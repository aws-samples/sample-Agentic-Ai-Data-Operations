source:
  name: pricing
  description: "Daily equity pricing (close, volume, market cap) by entity. Joins to entity_resolved via entity_id."
  type: s3
  format: csv
  location:
    bucket: "${var:data_lake_bucket}"
    prefix: "raw/pricing/"
  credentials:
    method: iam_role
    role_arn: "${secret:glue_service_role_arn}"
  schema:
    inferred: true
    crawler_database: pricing_db
  frequency: ad_hoc
  partition_by: ingestion_date
  owner: pricing-data-team
  contact: pricing-data@company.com

ingestion:
  mode: batch
  schedule: null
  format_options:
    delimiter: ","
    header: true
    quote_char: '"'
    escape_char: "\\"
    null_values: ["", "NULL", "null", "N/A"]
  dedup_key: ["entity_id", "price_date"]

  retention:
    policy: keep_all_versions
    s3_versioning: true
    lifecycle_expiration_days: null
