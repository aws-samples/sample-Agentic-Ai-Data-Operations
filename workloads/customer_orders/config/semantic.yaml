# spec_hash: generated_by_metadata_agent
# template_id: semantic_metadata
# schema_version: v1
# rendered_at: 2026-10-22T18:18:44Z

dataset:
  name: customer_orders
  description: "E-commerce customer order transactions with GDPR-compliant PII handling"
  domain: sales
  owner: Sales Analytics Team
  sensitivity: Internal
  source: "${CUSTOMER_ORDERS_SOURCE_URI}"
  format: csv
  grain: "one row per order"
  compliance: GDPR

# Column metadata combining technical profiling + business context
columns:
  measures:
    - name: revenue
      data_type: DECIMAL(12,2)
      nullable: false
      description: "Net revenue after discount, half-up rounded to 2 decimals"
      unit: USD
      default_aggregation: SUM
      derived_from: "quantity * unit_price * (1 - discount_pct)"
      
    - name: quantity
      data_type: INTEGER
      nullable: false
      description: "Number of units ordered"
      unit: count
      default_aggregation: SUM
      
    - name: unit_price
      data_type: DECIMAL(10,2)
      nullable: false
      description: "Price per unit before discount"
      unit: USD
      default_aggregation: AVG
      
    - name: discount_pct
      data_type: DECIMAL(5,2)
      nullable: false
      description: "Discount percentage as fraction [0,1]"
      unit: fraction
      default_aggregation: AVG

  dimensions:
    - name: payment_method
      data_type: STRING
      nullable: false
      description: "Payment type"
      cardinality: low
      
    - name: order_status
      data_type: STRING
      nullable: false
      description: "Order fulfillment status"
      cardinality: low
      default_filter: "completed"

  temporal:
    - name: order_date
      data_type: DATE
      nullable: false
      description: "Date the order was placed"
      grain: day
      is_primary_temporal: true
      timezone: "America/New_York"
      
    - name: ship_date
      data_type: DATE
      nullable: true
      description: "Date the order was shipped (null if pending)"
      grain: day
      is_primary_temporal: false

  identifiers:
    - name: order_id
      data_type: STRING
      nullable: false
      description: "Unique order identifier"
      role: primary_key
      
    - name: customer_id
      data_type: STRING
      nullable: false
      description: "Customer identifier"
      role: foreign_key
      
    - name: product_id
      data_type: STRING
      nullable: false
      description: "Product identifier"
      role: foreign_key

  pii:
    - name: customer_email
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: EMAIL
      sensitivity: HIGH
      confidence: 0.98
      masking: hash
      gdpr_lawful_basis: consent
      
    - name: customer_phone
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: PHONE
      sensitivity: MEDIUM
      confidence: 0.95
      masking: mask_partial
      gdpr_lawful_basis: consent
      
    - name: credit_card_number
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: ACCOUNT
      sensitivity: CRITICAL
      confidence: 0.99
      masking: tokenize
      token_output_column: credit_card_token
      gdpr_lawful_basis: consent
      pci_dss: true
      
    - name: customer_name
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: NAME
      sensitivity: HIGH
      confidence: 0.97
      masking: mask_partial
      gdpr_lawful_basis: consent
      
    - name: shipping_address
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: ADDRESS
      sensitivity: MEDIUM
      confidence: 0.92
      masking: redact
      gdpr_lawful_basis: consent
      
    - name: city
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: ADDRESS
      sensitivity: MEDIUM
      confidence: 0.90
      masking: redact
      gdpr_lawful_basis: consent
      
    - name: state
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: ADDRESS
      sensitivity: MEDIUM
      confidence: 0.90
      masking: redact
      gdpr_lawful_basis: consent
      
    - name: zip_code
      data_type: STRING
      nullable: true
      classification: PII
      phi_type: ADDRESS
      sensitivity: MEDIUM
      confidence: 0.91
      masking: redact
      gdpr_lawful_basis: consent

# GDPR-specific compliance columns
  gdpr_compliance:
    - name: data_subject_id
      data_type: STRING
      nullable: false
      description: "GDPR data subject identifier (maps to customer_id)"
      derived_from: customer_id
      
    - name: consent_given
      data_type: BOOLEAN
      nullable: false
      description: "GDPR consent flag (demo fixture - replace before production)"
      default_value: true
      
    - name: consent_timestamp
      data_type: TIMESTAMP
      nullable: false
      description: "GDPR consent timestamp (demo uses fixed run start)"
      
    - name: is_deleted
      data_type: BOOLEAN
      nullable: false
      description: "GDPR right-to-erasure soft delete flag"
      default_value: false
      
    - name: deletion_requested_at
      data_type: TIMESTAMP
      nullable: true
      description: "GDPR erasure request timestamp"

# Dimension hierarchies
dimension_hierarchies:
  - name: time_hierarchy
    levels: ["year", "quarter", "month", "week", "day"]
    source_column: order_date
    description: "Standard calendar time hierarchy in America/New_York timezone"

# Default filters
default_filters:
  revenue_queries:
    condition: "order_status = 'completed'"
    reason: "Revenue should only include completed orders"
  active_records:
    condition: "is_deleted = false"
    reason: "GDPR: exclude soft-deleted records from analytics"

# Business terms
business_terms:
  - term: revenue
    synonyms: ["sales", "turnover", "income"]
    definition: "Final order amount after applying discount"
    sql_expression: "SUM(revenue)"
    default_filter: "order_status = 'completed' AND is_deleted = false"
    
  - term: order count
    synonyms: ["number of orders", "volume", "transactions"]
    definition: "Count of distinct orders"
    sql_expression: "COUNT(DISTINCT order_id)"
    
  - term: AOV
    synonyms: ["average order value", "basket size"]
    definition: "Average revenue per order"
    sql_expression: "SUM(revenue) / COUNT(DISTINCT order_id)"
    default_filter: "order_status = 'completed' AND is_deleted = false"

# Time intelligence
time_intelligence:
  fiscal_year_start: 1  # January
  week_starts_on: Monday
  timezone: "America/New_York"
  common_comparisons: ["MoM", "QoQ", "YoY", "WoW", "YTD", "MTD"]
  data_freshness:
    refresh_frequency: daily
    latest_data: "T-1"
    schedule_cron: "0 9 * * *"
    schedule_timezone: "America/New_York"
    note: "Data loads at 9am ET daily. Latest available data is previous day."

# Relationships
relationships: []

# GDPR compliance metadata
gdpr_compliance:
  lawful_basis: consent
  data_subject_identifier: customer_id
  retention_period_days: 365
  audit_retention_days: 2555
  right_to_erasure: true
  right_to_access: true
  consent_mechanism: "At ingestion (demo fixture - replace before production)"
  privacy_notice_url: "https://example.com/privacy"
  dpo_contact: "dpo@example.com"
  
# Encryption configuration
encryption:
  zones:
    landing:
      kms_key_alias: "alias/${CUSTOMER_ORDERS_GDPR_KMS_KEY_ALIAS}"
      algorithm: AES-256
      transport: TLS_1_3
    staging:
      kms_key_alias: "alias/${CUSTOMER_ORDERS_GDPR_KMS_KEY_ALIAS}"
      algorithm: AES-256
      transport: TLS_1_3
    publish:
      kms_key_alias: "alias/${CUSTOMER_ORDERS_GDPR_KMS_KEY_ALIAS}"
      algorithm: AES-256
      transport: TLS_1_3
  key_rotation:
    enabled: true
    frequency: annual

# Data stewardship
data_steward:
  owner: Sales Analytics Team
  domain: sales
  sensitivity: Internal
  contact: sales-analytics@example.com
