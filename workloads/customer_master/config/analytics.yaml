dashboard:
  name: customer-order-analytics
  display_name: Customer & Order Analytics
  description: Customer lifetime value, order trends, and regional performance.
  source_workloads:
    - customer_master
    - order_transactions
  joins:
    - left_dataset: customer_summary
      right_dataset: order_metrics
      left_column: customer_id
      right_column: customer_id

datasets:
  - id: customer_summary
    name: Customer Summary
    source_table: gold_db.customer_summary
    import_mode: SPICE
    columns:
      - {name: customer_id, type: STRING}
      - {name: customer_name, type: STRING}
      - {name: segment, type: STRING}
      - {name: order_count, type: INTEGER}
      - {name: lifetime_revenue, type: DECIMAL}
      - {name: status, type: STRING}
  - id: order_metrics
    name: Order Metrics
    source_table: gold_db.order_metrics
    import_mode: SPICE
    columns:
      - {name: order_id, type: STRING}
      - {name: customer_id, type: STRING}
      - {name: order_date, type: DATE}
      - {name: order_total, type: DECIMAL}
      - {name: order_type, type: STRING}
      - {name: status, type: STRING}
  - id: customer_fact
    name: Customer Fact
    source_table: gold_db.customer_fact
    import_mode: DIRECT_QUERY
    columns:
      - {name: customer_id, type: STRING}
      - {name: segment, type: STRING}
      - {name: lifetime_revenue, type: DECIMAL}
  - id: order_fact
    name: Order Fact
    source_table: gold_db.order_fact
    import_mode: DIRECT_QUERY
    columns:
      - {name: order_id, type: STRING}
      - {name: customer_id, type: STRING}
      - {name: order_date, type: DATE}
      - {name: revenue, type: DECIMAL}
      - {name: quantity, type: INTEGER}

visuals:
  - id: total_customers
    title: Total Customers
    type: KPI
    dataset_id: customer_summary
    filters:
      - {column: status, operator: EQUALS, values: [ACTIVE]}
    measures:
      - {expression: "COUNT(DISTINCT customer_id)", label: Customers}
  - id: total_revenue
    title: Total Revenue
    type: KPI
    dataset_id: customer_summary
    measures:
      - {expression: "SUM(lifetime_revenue)", label: Revenue}
  - id: revenue_by_segment
    title: Revenue by Segment
    type: BAR_CHART
    dataset_id: customer_summary
    dimensions:
      - {column: segment, label: Segment}
    measures:
      - {expression: "SUM(lifetime_revenue)", label: Revenue}
  - id: order_trend
    title: Order Trend
    type: LINE_CHART
    dataset_id: order_metrics
    dimensions:
      - {column: order_date, label: Month, granularity: MONTH}
    measures:
      - {expression: "COUNT(order_id)", label: Orders}
  - id: orders_by_type
    title: Orders by Type
    type: PIE_CHART
    dataset_id: order_metrics
    dimensions:
      - {column: order_type, label: Type}
    measures:
      - {expression: "COUNT(order_id)", label: Orders}
  - id: customers_by_segment
    title: Customers by Segment
    type: HORIZONTAL_BAR_CHART
    dataset_id: customer_summary
    dimensions:
      - {column: segment, label: Segment}
    measures:
      - {expression: "COUNT(DISTINCT customer_id)", label: Customers}
  - id: revenue_heatmap
    title: Revenue Heatmap
    type: HEAT_MAP
    dataset_id: order_fact
    dimensions:
      - {column: segment, label: Segment, axis: ROW}
      - {column: order_date, label: Month, axis: COLUMN}
    measures:
      - {expression: "SUM(revenue)", label: Revenue}
  - id: customer_order_detail
    title: Customer Order Detail
    type: TABLE
    dataset_id: customer_summary
    custom_sql: "SELECT c.customer_id, c.customer_name, o.order_id, o.revenue FROM gold_db.customer_fact c JOIN gold_db.order_fact o ON c.customer_id = o.customer_id LIMIT 20"
    columns_display:
      - {name: customer_id, label: Customer ID}
      - {name: customer_name, label: Customer}
      - {name: order_id, label: Order ID}
      - {name: revenue, label: Revenue}
    sort:
      column: revenue
      direction: DESC

permissions:
  - principal_type: group
    principal_name: analytics-viewers
    role: VIEWER
    actions:
      - quicksight:QueryDashboard
      - quicksight:DescribeDashboard
  - principal_type: group
    principal_name: analytics-authors
    role: AUTHOR
    actions:
      - quicksight:QueryDashboard
      - quicksight:DescribeDashboard
      - quicksight:UpdateDashboard

refresh:
  schedule:
    cron: "0 8 * * *"
    timezone: UTC
  datasets:
    - {dataset_id: customer_summary, import_mode: SPICE}
    - {dataset_id: order_metrics, import_mode: SPICE}
