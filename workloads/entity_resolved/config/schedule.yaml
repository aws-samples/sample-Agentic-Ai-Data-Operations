# Orchestration schedule — feeds DAG Agent
# User-confirmed: manual trigger only (schedule_interval=None)

schedule:
  dag_id: entity_resolved_pipeline
  description: "Manual ETL: Bronze → Silver for entity_resolved reference data."
  cron: null
  timezone: "UTC"
  start_date: "2026-05-01"
  catchup: false
  max_active_runs: 1
  retries: 3
  retry_delay_minutes: 5
  retry_exponential_backoff: true

  dependencies:
    upstream_dags: []
    sensors:
      - type: s3_key
        bucket: "${var:data_lake_bucket}"
        prefix: "raw/reference/entity_resolved/"
        poke_interval: 300
        timeout: 3600
        # Manual trigger model: sensor confirms file exists once user has uploaded.
        mode: poke

  sla:
    critical_path_tasks:
      - bronze_to_silver
      - quality_gate_silver
    max_duration_minutes: 30

  notifications:
    on_failure:
      - type: sns
        topic_arn: "${var:alert_sns_topic}"

  tags:
    - entity_resolved
    - reference-data
    - manual
