schedule:
  dag_id: fundamentals_balance_sheet_pipeline
  description: "Manual ETL: Bronze -> Silver for annual balance sheet fundamentals."
  cron: null
  timezone: "UTC"
  start_date: "2026-05-01"
  catchup: false
  max_active_runs: 1
  retries: 3
  retry_delay_minutes: 5
  retry_exponential_backoff: true

  dependencies:
    upstream_dags: []
    sensors:
      - type: s3_key
        bucket: "${var:data_lake_bucket}"
        prefix: "raw/fundamentals/balance_sheet/"
        poke_interval: 300
        timeout: 3600
        mode: poke

  sla:
    critical_path_tasks:
      - bronze_to_silver
      - quality_gate_silver
    max_duration_minutes: 30

  notifications:
    on_failure:
      - type: sns
        topic_arn: "${var:alert_sns_topic}"

  tags:
    - fundamentals_balance_sheet
    - fundamentals
    - manual
