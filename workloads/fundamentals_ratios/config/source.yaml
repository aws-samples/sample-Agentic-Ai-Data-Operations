source:
  name: fundamentals_ratios
  description: "Annual financial ratios (PE, PB, EV/EBITDA, ROE) by entity and fiscal period."
  type: s3
  format: csv
  location:
    bucket: "${var:data_lake_bucket}"
    prefix: "raw/fundamentals/ratios/"
  credentials:
    method: iam_role
    role_arn: "${secret:glue_service_role_arn}"
  schema:
    inferred: true
    crawler_database: fundamentals_ratios_db
  frequency: ad_hoc
  partition_by: ingestion_date
  owner: fundamentals-data-team
  contact: fundamentals-data@company.com

ingestion:
  mode: batch
  schedule: null
  format_options:
    delimiter: ","
    header: true
    quote_char: '"'
    escape_char: "\\"
    null_values: ["", "NULL", "null", "N/A"]
  dedup_key: ["entity_id", "fiscal_period_id"]

  retention:
    policy: keep_all_versions
    s3_versioning: true
    lifecycle_expiration_days: null
