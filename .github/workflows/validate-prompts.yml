# Prompt and contract integrity — runs on every PR to main
#
# The failure mode this exists to catch: the orchestrator loads a regulation control set, a
# runbook, or a helper module by `Read`-ing a path written in a markdown file. A wrong path
# fails at read time and the run *continues without the content* — no exception, no log line.
# That is how 17 of 35 prompt paths (49%) rotted here undetected. Nothing else in CI looks at
# markdown.

name: Validate Prompts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  doc-links:
    name: Doc & prompt path references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate referenced paths resolve
        run: python3 scripts/validate_docs_links.py

  contracts:
    name: Contract schemas & tool registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate contract schemas
        run: python3 scripts/validate_contracts.py

      - name: Validate MCP tool registry
        run: python3 scripts/validate_tool_registry.py

  agent-definitions:
    name: .codex/agents definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A malformed agent contract is dangerous: the harness may fall back to a broad
      # toolset, so a sub-agent silently gains access that the Codex skills forbid.
      - name: Check TOML agent contracts
        run: |
          python3 - <<'PY'
          import pathlib
          import sys
          import tomllib

          errors = []
          agents = sorted(pathlib.Path(".codex/agents").glob("*.toml"))
          if not agents:
              sys.exit(".codex/agents/ is empty — every named sub-agent would spawn as general-purpose")

          for path in agents:
              try:
                  contract = tomllib.loads(path.read_text())
              except tomllib.TOMLDecodeError as e:
                  errors.append(f"{path}: invalid TOML: {e}")
                  continue

              for key in ("name", "description", "sandbox_mode", "developer_instructions"):
                  if not contract.get(key):
                      errors.append(f"{path}: missing '{key}'")

              if contract.get("name") and contract["name"] != path.stem:
                  errors.append(f"{path}: name '{contract['name']}' != filename stem '{path.stem}'")

              instructions = contract.get("developer_instructions", "")
              if "subagent_type" in instructions:
                  errors.append(f"{path}: contains a legacy agent-runtime reference")

          if errors:
              print(f"FAIL: {len(errors)} problem(s) in .codex/agents/\n")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print(f"OK: {len(agents)} agent definition(s) valid")
          PY

  codegen-drift:
    name: Deterministic codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema jinja2

      # The validator exits 0 on an empty argument list, so pass the workload dirs explicitly
      # — a bare invocation is a vacuous pass, not a clean one.
      - name: Validate no drift between specs and rendered artifacts
        run: |
          workloads=$(find workloads -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort)
          if [ -z "$workloads" ]; then
            echo "No workloads to check"
            exit 0
          fi
          echo "Checking: $workloads"
          python3 -m shared.codegen.drift_validator $workloads
