# Translated from .mcp.json for Codex CLI.
# Servers ship disabled: they call AWS with AWS_PROFILE=default. Enable per server
# after pointing AWS_PROFILE at the intended (non-production) account.
[agents]

[mcp_servers."glue-athena"]
enabled = false
command = "uv"
args = ["run", "--no-project", "--with", "fastmcp", "--with", "boto3", "--python", "3.13", "mcp-servers/glue-athena-server/server.py"]
env = { "AWS_REGION" = "us-east-1", "AWS_PROFILE" = "default" }

[mcp_servers."lakeformation"]
enabled = false
command = "uv"
args = ["run", "--no-project", "--with", "fastmcp", "--with", "boto3", "--python", "3.13", "mcp-servers/lakeformation-server/server.py"]
env = { "AWS_REGION" = "us-east-1", "AWS_PROFILE" = "default" }

