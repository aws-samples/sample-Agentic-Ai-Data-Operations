name = "iac-agent"
description = "Converts a built workload's artifacts (Glue PySpark, MWAA DAG, YAML configs, quality rules, Cedar policies) into deployable Terraform / CDK Python / CDK TypeScript / CloudFormation plus an APPLY_GUIDE.md. Generation only \u2014 never applies. Spawned by the Data Onboarding Agent or the DevOps workflow after Phase 4 artifacts exist."
