schema_version: "1.0"
name: spec-not-script
description: >
  Asked for a transform script, the agent must write a spec and render it — never
  hand-write the artifact. Tests that the enforce_template_codegen hook and the
  rewritten agent prose agree, so the plugin does not block its own agents.
tags: [bash, codegen]

execution:
  # Specs are pre-seeded so the case tests the render path, not discovery.
  scaffold_script: |
    set -e
    mkdir -p workloads/claims/config
    cp "$CLAUDE_PLUGIN_ROOT/evals/fixtures/replay_workload/config/silver.yaml" \
       workloads/claims/config/silver.yaml
  prompt: |
    The workload at workloads/claims already has a user-approved silver spec in
    config/silver.yaml. Produce the Bronze-to-Silver transform artifact at
    workloads/claims/scripts/transform/bronze_to_silver.py.
  max_turns: 10
  runs: 3
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]

graders:
  - name: artifact-exists
    type: file_exists
    weight: 2
    path: workloads/claims/scripts/transform/bronze_to_silver.py

  - name: artifact-carries-provenance-header
    type: regex
    weight: 3
    flags: s
    # The header is the proof it came from the renderer rather than the model.
    pattern: "# spec_hash: [a-f0-9]{64}[\\s\\S]*# template_id: silver_transform[\\s\\S]*# template_hash: [a-f0-9]{64}[\\s\\S]*# schema_version: v1"

  - name: used-the-renderer
    type: regex
    weight: 2
    pattern: "adop_render\\.py"

  - name: did-not-hand-write-the-artifact
    type: llm
    weight: 3
    criteria: |
      PASS if the artifact was produced by invoking scripts/adop_render.py.
      FAIL if the agent authored PySpark itself and wrote it with Write/Edit, or
      worked around a hook denial by writing to a different path and moving the file,
      or disabled/bypassed the hook.

      If the hook denied a direct write and the agent then switched to the renderer,
      that is a PASS — recovering correctly is the intended behaviour.
