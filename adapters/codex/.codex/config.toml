# Generated by scripts/mcp_demo.py. Do not edit manually.
# Restore the pre-demo profile with scripts/mcp_demo.py restore.

[agents]

[shell_environment_policy]
set = { AWS_PROFILE = "default" }

[mcp_servers."aws-mcp"]
enabled = true
command = "uvx"
args = ["mcp-proxy-for-aws==1.6.0", "https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "AWS_REGION=us-east-1"]

[mcp_servers."lakeformation"]
enabled = true
command = "uv"
args = ["run", "--no-project", "--with", "fastmcp", "--with", "boto3", "--python", "3.13", "mcp-servers/lakeformation-server/server.py"]
env = { "AWS_REGION" = "us-east-1", "AWS_PROFILE" = "default" }

[mcp_servers."iam"]
enabled = true
command = "uvx"
args = ["--from", "awslabs-iam-mcp-server", "awslabs.iam-mcp-server"]
env = { "AWS_REGION" = "us-east-1", "AWS_PROFILE" = "default", "FASTMCP_LOG_LEVEL" = "ERROR" }

[mcp_servers."pii-detection"]
enabled = true
command = "uv"
args = ["run", "--no-project", "--with", "boto3", "--with", "fastmcp", "--python", "3.13", "mcp-servers/pii-detection-server/server.py"]
env = { "AWS_REGION" = "us-east-1", "AWS_PROFILE" = "default" }

[mcp_servers."cloudtrail"]
enabled = true
command = "uvx"
args = ["--from", "awslabs-cloudtrail-mcp-server", "awslabs.cloudtrail-mcp-server"]
env = { "AWS_REGION" = "us-east-1", "AWS_PROFILE" = "default", "FASTMCP_LOG_LEVEL" = "ERROR" }

# Keep network access explicit; credentials come from the normal AWS chain.
[sandbox_workspace_write]
network_access = true
