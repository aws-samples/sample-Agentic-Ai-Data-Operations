[project]
name = "agentic-data-onboarding"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest",
    "pyyaml",
    "rdflib>=7.0,<8",
    "jinja2==3.1.4",
    "jsonschema==4.23.0",
    # Required: the Cedar gate fails closed (denies) without it.
    "cedarpy==4.12.2",
]

[project.optional-dependencies]
control-plane = ["boto3>=1.34", "PyJWT>=2.8", "cryptography>=42"]
connector-drivers = [
    "psycopg[binary]",
    "snowflake-connector-python",
    "databricks-sql-connector",
    "teradatasql",
]
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]
avp = ["boto3"]
reic = ["sentence-transformers>=2.2.0", "faiss-cpu>=1.7.0"]
hooks = ["pre-commit>=3.7.0", "bandit[toml]>=1.7.9", "pip-audit>=2.7.0", "detect-secrets>=1.5.0"]
strands = ["strands-agents==1.62.0"]
strands-agentcore = ["bedrock-agentcore==1.25.0"]

[project.scripts]
adop = "shared.control_plane.workspace_context:main"

[tool.setuptools.packages.find]
include = ["api*", "shared*", "runtimes*"]
exclude = ["adapters*", "contracts*", "core*", "logs*", "plugins*", "runbooks*", "workloads*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["workloads", "shared", "tests"]

[tool.bandit]
exclude_dirs = ["tests", "demo", "shared/tests"]
skips = ["B101"]
